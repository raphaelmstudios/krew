services:
  - type: web
    name: krew
    env: node
    plan: free
    # --include=dev: with NODE_ENV=production npm would otherwise skip Vite, which the build needs.
    buildCommand: "cd client && npm install --include=dev && npm run build && cd ../server && npm install"
    # npm start runs server/src/start.js: it puts back the latest off-site backup when the disk
    # is empty (every restart and redeploy on the free plan), then starts KREW.
    startCommand: "cd server && npm start"
    healthCheckPath: /api/health
    envVars:
      # Turns on the production-only protections in server/src/security.js and auth.js:
      # secure cookies, the HTTPS redirect, HSTS and trusting Render's proxy.
      - key: NODE_ENV
        value: production
      # better-sqlite3 needs Node 22 or newer.
      - key: NODE_VERSION
        value: "22"
      # Your own admin account, created at start-up if it doesn't exist yet.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # "false" for a real pilot (start empty). "true" for a demo site: the demo accounts and jobs
      # are loaded when the database is empty and no backup exists. See the README.
      - key: SEED_DEMO_DATA
        sync: false
      # Only used when SEED_DEMO_DATA is "true": the private password for every demo account.
      - key: DEMO_PASSWORD
        sync: false
      # Off-site backups (server/src/backup.js). The free plan wipes the disk on every restart
      # and redeploy, so KREW saves the database and photos to S3-compatible storage (such as
      # Backblaze B2) and restores them when it starts. All six are needed; see the README.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
