# Fly.io settings for KREW. One small always-on machine, with a 1 GB volume at /data that
# holds the database and uploaded photos. See the README's "Deploying on Fly.io" section.

# The app name becomes the web address (<name>.fly.dev) and must be unique on Fly.
# Change it if "krew" is taken.
app = "krew"

# Johannesburg: the closest Fly region to Nairobi, so pages load fastest for Kenyan users.
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/krew.db"
  UPLOADS_DIR = "/data/uploads"
  # Real pilot: start with an empty database. Set to "true" (and set the DEMO_PASSWORD secret)
  # only for a demo site, and only before the database has any accounts in it.
  SEED_DEMO_DATA = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: never stop the machine when it's quiet, so the site doesn't sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# The volume that keeps the data. KREW must run on exactly ONE machine, because each machine
# gets its own volume - a second machine would have a separate, empty database.
[[mounts]]
  source = "krew_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# A little swap space as a safety net in case memory runs short.
swap_size_mb = 512
